<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Graph Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{
  --paper:#eef3ef; --grid:#d6e2dc; --ink:#1b2a35; --muted:#5d6f7b; --card:#ffffff; --line:#c3d2cb;
  --doer:#e0457b; --action:#d99100; --receiver:#1a9e6f;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Bricolage Grotesque',system-ui,Segoe UI,Arial,sans-serif;color:var(--ink);
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:18px 22px 10px}
h1{font-size:26px;font-weight:800;margin:0 18px 0 0;letter-spacing:-.5px}
.inputrow{display:flex;gap:10px;flex:1;min-width:280px}
textarea{flex:1;height:62px;border:2px solid var(--ink);border-radius:10px;padding:9px 11px;font:inherit;font-size:16px;background:var(--card);color:var(--ink);resize:vertical}
button{font:inherit;font-weight:600;border:2px solid var(--ink);border-radius:10px;padding:9px 16px;background:var(--ink);color:#fff;cursor:pointer}
button.alt{background:var(--card);color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
main{padding:0 22px 22px;display:grid;gap:10px}
#controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#stepInfo{font-weight:600;margin-right:auto}
label.sp{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px}
#sentencePanel{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:10px 16px;min-height:56px;font-size:19px;line-height:2.1}
.sent{transition:opacity .6s}
.mark{border-bottom:4px solid;border-radius:4px;padding:0 3px;margin:0 1px}
.mark small{font-size:12px;margin-left:5px;font-weight:700}
#caption{font-size:18px;font-weight:600;min-height:28px}
#graph{width:100%;height:56vh;min-height:340px;background:rgba(255,255,255,.65);border:2px solid var(--ink);border-radius:12px}
#legend{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--muted)}
#legend span{display:flex;align-items:center;gap:6px}
#legend i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
#tip{position:absolute;display:none;max-width:340px;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.7;z-index:10;pointer-events:none;box-shadow:4px 4px 0 var(--ink)}
.note{flex-basis:100%;margin:2px 0 0;font-size:14px;color:var(--muted)}
.note b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.sent{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Knowledge Graph Explorer</h1>
  <div class="inputrow">
    <textarea id="input" aria-label="Your sentences">Marie Curie was born in Warsaw. She discovered radium. She won the Nobel Prize in Physics.</textarea>
    <button id="buildBtn">Build graph</button>
  </div>
  <p class="note"><b>Tip:</b> start every sentence with a capital letter and use full names, like this: “Sriram is a Student. Sriram Studies in College.”</p>
</header>
<main>
  <div id="controls">
    <span id="stepInfo"></span>
    <button id="nextBtn" class="alt" disabled>Next step</button>
    <button id="autoBtn" class="alt" disabled>Auto play</button>
    <label class="sp">Speed <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1"></label>
  </div>
  <div id="sentencePanel" aria-live="polite"></div>
  <div id="caption" aria-live="polite"></div>
  <svg id="graph" role="img" aria-label="Knowledge graph">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a35"/></marker></defs>
    <g id="edges"></g><g id="nodes"></g>
  </svg>
  <div id="legend"></div>
</main>
<div id="tip"></div>

<script>
const COLORS={PER:'#ff8fab',ORG:'#ffc145',LOC:'#4fd1b5',MISC:'#b4a6ff',CONCEPT:'#79b8ff'};
const NAMES={PER:'Person',ORG:'Organisation',LOC:'Place',MISC:'Other name',CONCEPT:'Idea or thing'};
const DOER='#e0457b',ACTION='#d99100',RECEIVER='#1a9e6f';
const R=42;
const $=id=>document.getElementById(id);
const gE=d3.select('#edges'),gN=d3.select('#nodes'),svg=d3.select('#graph');
let data,steps=[],cur=0,busy=false,autoOn=false,runId=0,pos={},marks={},pairCount={};

const speed=()=>parseFloat($('speed').value);
async function wait(ms){const id=runId;await new Promise(r=>setTimeout(r,ms/speed()));if(id!==runId)throw 'cancel';}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mk=(sp,color,tag)=>sp?{start:sp[0],end:sp[1],color,tag}:null;
const cap=t=>{$('caption').textContent=t;};

function renderSentence(text,ms){
  ms=ms.filter(Boolean).sort((a,b)=>a.start-b.start);
  let out='',p=0;
  for(const m of ms){
    if(m.start<p)continue;
    out+=esc(text.slice(p,m.start));
    out+=`<span class="mark" style="border-color:${m.color};background:${m.color}33">${esc(text.slice(m.start,m.end))}${m.tag?`<small style="color:${m.color}">${esc(m.tag)}</small>`:''}</span>`;
    p=m.end;
  }
  return out+esc(text.slice(p));
}
const setSent=(i,ms)=>{$('s'+i).innerHTML=renderSentence(data.sentences[i].text,ms);};
const setRaw=(i,t,ms)=>{$('s'+i).innerHTML=renderSentence(t,ms);};
const nodeText=id=>data.nodes.find(n=>n.id===id).text;

function wrapText(s,max=11){
  const lines=[];let line='';
  for(const w of s.split(' ')){
    if((line+' '+w).trim().length>max&&line){lines.push(line);line=w;}else line=(line+' '+w).trim();
  }
  if(line)lines.push(line);
  if(lines.length>3){lines.length=3;lines[2]=lines[2].slice(0,max-1)+'…';}
  return lines;
}

function computeLayout(){
  const box=$('graph').getBoundingClientRect(),w=box.width,h=box.height;
  svg.attr('viewBox',`0 0 ${w} ${h}`);
  const nodes=data.nodes.map(n=>({id:n.id}));
  const links=data.edges.map(e=>({source:e.source,target:e.target}));
  const sim=d3.forceSimulation(nodes)
    .force('link',d3.forceLink(links).id(d=>d.id).distance(Math.min(190,w/3)))
    .force('charge',d3.forceManyBody().strength(-900))
    .force('center',d3.forceCenter(w/2,h/2))
    .force('collide',d3.forceCollide(R+34)).stop();
  for(let i=0;i<350;i++)sim.tick();
  pos={};
  nodes.forEach(n=>{pos[n.id]={x:Math.max(R+12,Math.min(w-R-12,n.x)),y:Math.max(R+12,Math.min(h-R-12,n.y))};});
}

function addNode(n){
  const p=pos[n.id];
  const g=gN.append('g').attr('transform',`translate(${p.x},${p.y})`);
  g.append('circle').attr('r',0).attr('fill',COLORS[n.label]||COLORS.CONCEPT).attr('stroke','#1b2a35').attr('stroke-width',3)
    .transition().duration(650/speed()).ease(d3.easeBackOut.overshoot(2)).attr('r',R);
  const t=g.append('text').attr('text-anchor','middle').attr('fill','#1b2a35').attr('font-size',13).attr('font-weight',700).style('opacity',0);
  const lines=wrapText(n.text);
  lines.forEach((l,i)=>t.append('tspan').attr('x',0).attr('dy',i===0?`${0.35-(lines.length-1)*0.6}em`:'1.2em').text(l));
  t.transition().delay(350/speed()).duration(300).style('opacity',1);
}

function drawEdge(e){
  const a=pos[e.source],b=pos[e.target];
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
  const x1=a.x+ux*R,y1=a.y+uy*R,x2=b.x-ux*(R+7),y2=b.y-uy*(R+7);
  const k=[e.source,e.target].sort().join('|');
  const c=pairCount[k]=(pairCount[k]||0)+1;
  const g=gE.append('g');
  g.append('line').attr('x1',x1).attr('y1',y1).attr('x2',x1).attr('y2',y1)
    .attr('stroke','#1b2a35').attr('stroke-width',3).attr('marker-end','url(#arrow)')
    .transition().duration(900/speed()).ease(d3.easeCubicInOut).attr('x2',x2).attr('y2',y2);
  g.append('text').attr('x',(x1+x2)/2).attr('y',(y1+y2)/2-9-(c-1)*17).attr('text-anchor','middle')
    .attr('font-size',14).attr('font-weight',700).attr('fill','#1b2a35')
    .attr('stroke','#eef3ef').attr('stroke-width',5).attr('paint-order','stroke').style('opacity',0).text(e.label)
    .transition().delay(650/speed()).duration(350).style('opacity',1);
  g.append('line').attr('x1',x1).attr('y1',y1).attr('x2',x2).attr('y2',y2)
    .attr('stroke','transparent').attr('stroke-width',20).style('cursor','help')
    .on('mouseenter',ev=>showTip(ev,e)).on('mousemove',moveTip).on('mouseleave',hideTip).on('click',ev=>showTip(ev,e));
}

function showTip(ev,e){
  const s=data.sentences[e.sentence],v=e.evidence,t=$('tip');
  const part=sp=>esc(s.text.slice(sp[0],sp[1]));
  t.innerHTML=`<b>Why this fact?</b><br>${renderSentence(s.text,[mk(v.subject,DOER,'doer'),mk(v.verb,ACTION,'action'),mk(v.object,RECEIVER,'receiver')])}<br>`+
    `<span style="color:${DOER}">${part(v.subject)}</span> → <span style="color:${ACTION}">${esc(e.label)}</span> → <span style="color:${RECEIVER}">${part(v.object)}</span>`;
  t.style.display='block';moveTip(ev);
}
function moveTip(ev){const t=$('tip');t.style.left=Math.min(ev.pageX+14,window.innerWidth-t.offsetWidth-10)+'px';t.style.top=(ev.pageY+14)+'px';}
function hideTip(){$('tip').style.display='none';}

function buildSteps(){
  steps=[];
  steps.push({title:'Read the sentences',run:async()=>{
    cap('First, the text is cut into separate sentences.');
    for(let i=0;i<data.sentences.length;i++){$('s'+i).style.opacity=1;await wait(650);}
  }});
  if(data.sentences.some(s=>s.corefs.length)){
    steps.push({title:'Link words like he, she, it',run:async()=>{
      for(const s of data.sentences){
        if(!s.corefs.length)continue;
        setRaw(s.index,s.original||s.text,s.corefs.map(c=>mk([c.start,c.end],'#d99100','= '+c.refers_to)));
        for(const c of s.corefs){cap(`“${c.word}” is just another name for “${c.refers_to}”.`);await wait(1300);}
        marks[s.index]=s.corefs.map(c=>mk([c.new_start,c.new_end],'#d99100',''));
        setSent(s.index,marks[s.index]);
        cap('Now the sentence says exactly who does the action.');await wait(1200);
      }
    }});
  }
  steps.push({title:'Find the things',run:async()=>{
    for(const s of data.sentences){
      for(const e of s.entities){
        marks[s.index]=(marks[s.index]||[]).filter(m=>m.start!==e.start).concat(mk([e.start,e.end],COLORS[e.label]||COLORS.CONCEPT,NAMES[e.label]));
        setSent(s.index,marks[s.index]);
        cap(`The AI model reads the words and decides: “${e.text}” is a ${NAMES[e.label]}.`);
        await wait(1100);
      }
    }
    cap('Each highlighted name will become a circle. The same name in two sentences is ONE circle.');await wait(1000);
  }});
  steps.push({title:'Create the nodes',run:async()=>{
    for(const n of data.nodes){addNode(n);cap(`New node: ${n.text}`);await wait(800);}
  }});
  steps.push({title:'Connect the nodes',run:async()=>{
    for(const e of data.edges){
      data.sentences.forEach((_,i)=>{$('s'+i).style.opacity=i===e.sentence?1:0.3;});
      const v=e.evidence;
      setSent(e.sentence,[mk(v.subject,DOER,'doer'),mk(v.verb,ACTION,'action'),mk(v.object,RECEIVER,'receiver')]);
      cap(`${nodeText(e.source)}  —  ${e.label}  →  ${nodeText(e.target)}`);
      await wait(1400);drawEdge(e);await wait(1200);
      setSent(e.sentence,marks[e.sentence]||[]);
    }
    data.sentences.forEach((_,i)=>{$('s'+i).style.opacity=1;});
  }});
  steps.push({title:'The finished graph',run:async()=>{
    cap(data.edges.length?'Done! Point at any arrow to see why that fact exists.':'No connections were found in this text.');
  }});
}

function updateButtons(){
  $('nextBtn').disabled=busy||autoOn||cur>=steps.length;
  $('autoBtn').disabled=busy||autoOn||!steps.length;
  $('autoBtn').textContent=steps.length&&cur>=steps.length?'Replay':'Auto play';
}

function load(d){
  runId++;data=d;cur=0;busy=false;autoOn=false;marks={};pairCount={};hideTip();
  gE.selectAll('*').remove();gN.selectAll('*').remove();cap('');
  $('sentencePanel').innerHTML='';
  d.sentences.forEach((s,i)=>{const el=document.createElement('div');el.className='sent';el.id='s'+i;el.style.opacity=0;el.textContent=s.original||s.text;$('sentencePanel').appendChild(el);});
  computeLayout();buildSteps();$('stepInfo').textContent='';updateButtons();
}

async function runNext(){
  if(busy||cur>=steps.length)return;
  busy=true;const id=runId;updateButtons();
  try{
    $('stepInfo').textContent=`Step ${cur+1} of ${steps.length}: ${steps[cur].title}`;
    await steps[cur].run();cur++;
  }catch(e){if(e!=='cancel')console.error(e);}
  if(id===runId){busy=false;updateButtons();}
}

async function auto(){
  if(autoOn||busy)return;
  if(cur>=steps.length)load(data);
  autoOn=true;const id=runId;updateButtons();
  try{
    while(cur<steps.length){await runNext();if(id!==runId)return;await wait(600);}
  }catch(e){}
  if(id===runId){autoOn=false;updateButtons();}
}

$('nextBtn').onclick=runNext;
$('autoBtn').onclick=auto;
$('buildBtn').onclick=async()=>{
  const text=$('input').value.trim();if(!text)return;
  $('buildBtn').disabled=true;
  cap('The AI model is reading your text… (the first request can take up to a minute while the server wakes up)');
  try{
    const r=await fetch('/api/graph',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    const d=await r.json();
    if(!d.nodes||!d.nodes.length){cap('No names or things found. Try: Elon Musk founded SpaceX in 2002.');}
    else{load(d);auto();}
  }catch(err){cap('Something went wrong. Check your connection and press Build graph again.');}
  $('buildBtn').disabled=false;
};

(function legend(){
  $('legend').innerHTML=Object.keys(NAMES).map(k=>`<span><i style="background:${COLORS[k]}"></i>${NAMES[k]}</span>`).join('');
})();

/* Opening animation: a ready-made example plays by itself, so the page teaches before anyone types. */
function demo(){
  const O=['Marie Curie was born in Warsaw.','She discovered radium.','She won the Nobel Prize.'];
  const R=['Marie Curie was born in Warsaw.','Marie Curie discovered radium.','Marie Curie won the Nobel Prize.'];
  const f=(i,w)=>{const a=R[i].indexOf(w);return [a,a+w.length];};
  const ent=(i,w,l)=>({text:w,label:l,start:f(i,w)[0],end:f(i,w)[1]});
  const co=(i)=>({word:'She',start:0,end:3,new_start:0,new_end:11,refers_to:'Marie Curie'});
  const ed=(s,t,l,i,a,b,c)=>({source:s,target:t,label:l,sentence:i,evidence:{subject:f(i,a),verb:f(i,b),object:f(i,c)}});
  return {
    sentences:[
      {index:0,original:O[0],text:R[0],entities:[ent(0,'Marie Curie','PER'),ent(0,'Warsaw','LOC')],corefs:[]},
      {index:1,original:O[1],text:R[1],entities:[ent(1,'Marie Curie','PER'),ent(1,'radium','CONCEPT')],corefs:[co(1)]},
      {index:2,original:O[2],text:R[2],entities:[ent(2,'Marie Curie','PER'),ent(2,'Nobel Prize','MISC')],corefs:[co(2)]}],
    nodes:[{id:'marie curie',text:'Marie Curie',label:'PER'},{id:'warsaw',text:'Warsaw',label:'LOC'},
           {id:'radium',text:'radium',label:'CONCEPT'},{id:'nobel prize',text:'Nobel Prize',label:'MISC'}],
    edges:[ed('marie curie','warsaw','born in',0,'Marie Curie','was born in','Warsaw'),
           ed('marie curie','radium','discovered',1,'Marie Curie','discovered','radium'),
           ed('marie curie','nobel prize','won',2,'Marie Curie','won','Nobel Prize')]
  };
}
window.addEventListener('load',()=>{load(demo());auto();});
</script>
</body>
</html>
